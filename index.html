<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도플러 효과 시뮬레이션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        .math-fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 4px;
        }
        .math-numerator {
            border-bottom: 1px solid black;
            padding: 0 4px;
            font-size: 1rem;
        }
        .math-denominator {
            padding: 0 4px;
            font-size: 1rem;
        }
        canvas {
            background-color: #ffffff;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        /* Range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ef4444;
            cursor: pointer;
            margin-top: -8px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #d1d5db;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen p-4 text-gray-800 flex flex-col items-center">

    <!-- Header -->
    <header class="w-full max-w-5xl bg-white p-6 rounded-lg shadow-md mb-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">[2022개정 교육과정 '역학과 에너지'] 도플러 효과</h1>
        <div class="flex items-center gap-2 text-blue-700 bg-blue-50 p-3 rounded-md">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p class="font-medium"><strong>학습 목표:</strong> 도플러 효과를 이해하고 설명할 수 있다.</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left: Canvas & Controls -->
        <div class="lg:col-span-2 flex flex-col gap-4">
            
            <!-- Canvas -->
            <div class="relative w-full aspect-[2/1] bg-white rounded-lg overflow-hidden border border-gray-200">
                <canvas id="simCanvas" class="w-full h-full block"></canvas>
                <!-- Reset Notification -->
                <div id="resetNoti" class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-1 rounded-full text-sm opacity-0 transition-opacity duration-300 pointer-events-none">
                    위치가 초기화 되었습니다
                </div>
            </div>

            <!-- Controls -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <!-- Tabs -->
                <div class="flex border-b border-gray-200 mb-6">
                    <button id="tab1" class="tab-btn flex-1 py-2 text-center font-bold text-blue-600 border-b-2 border-blue-600" onclick="setMode(1)">1. 관찰자만 운동</button>
                    <button id="tab2" class="tab-btn flex-1 py-2 text-center font-medium text-gray-500 hover:text-gray-700" onclick="setMode(2)">2. 음원만 운동</button>
                    <button id="tab3" class="tab-btn flex-1 py-2 text-center font-medium text-gray-500 hover:text-gray-700" onclick="setMode(3)">3. 일반적인 관계식</button>
                </div>

                <!-- Sliders -->
                <div class="space-y-6">
                    <!-- Observer Slider -->
                    <div id="obsControl" class="space-y-2">
                        <div class="flex justify-between items-center">
                            <label class="font-semibold text-gray-700">관찰자(O)의 속력 (<span class="italic">v<sub>O</sub></span>)</label>
                            <span id="voValue" class="text-red-500 font-bold">0 m/s</span>
                        </div>
                        <input type="range" id="sliderVo" min="-85" max="85" step="1" value="0" oninput="updateState()">
                        <div class="flex justify-between text-xs text-gray-500">
                            <span>멀어짐 (음수)</span>
                            <span>정지 (0)</span>
                            <span>다가감 (양수)</span>
                        </div>
                    </div>

                    <!-- Source Slider -->
                    <div id="srcControl" class="space-y-2 opacity-50 pointer-events-none">
                        <div class="flex justify-between items-center">
                            <label class="font-semibold text-gray-700">음원(S)의 속력 (<span class="italic">v<sub>s</sub></span>)</label>
                            <span id="vsValue" class="text-red-500 font-bold">0 m/s</span>
                        </div>
                        <input type="range" id="sliderVs" min="-85" max="85" step="1" value="0" oninput="updateState()">
                        <div class="flex justify-between text-xs text-gray-500">
                            <span>멀어짐 (음수)</span>
                            <span>정지 (0)</span>
                            <span>다가감 (양수)</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right: Math & Explanation -->
        <div class="bg-white p-6 rounded-lg shadow-md flex flex-col gap-6">
            <div>
                <h2 class="text-lg font-bold text-gray-800 mb-2 border-b-2 border-gray-100 pb-2">기본 조건</h2>
                <ul class="text-sm text-gray-600 space-y-1">
                    <li>원래 소리의 진동수 (<span class="italic font-serif">f</span>) = <span class="font-semibold">1000 Hz</span></li>
                    <li>소리의 속력 (<span class="italic font-serif">v</span>) = <span class="font-semibold">340 m/s</span></li>
                </ul>
            </div>

            <div class="bg-blue-50 p-4 rounded-md border border-blue-100 flex-1">
                <h2 class="text-lg font-bold text-blue-900 mb-3">계산 및 결과</h2>
                
                <!-- Formula Display -->
                <div class="text-center mb-4 text-lg" id="formulaDisplay">
                    <!-- Javascript will inject formula here -->
                </div>

                <!-- Calculation Display -->
                <div class="text-center mb-6 text-xl font-bold text-gray-800" id="calculationDisplay">
                    <!-- Javascript will inject calculation here -->
                </div>

                <!-- Easy Explanation -->
                <h3 class="font-bold text-gray-700 mb-1">쉬운 설명:</h3>
                <p id="explanationText" class="text-sm text-gray-700 leading-relaxed bg-white p-3 rounded shadow-sm border border-gray-200">
                    <!-- Javascript will inject text here -->
                </p>
            </div>

            <button onclick="openQuiz()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                이제 내가 이해했는지 확인해보자!
            </button>
        </div>
    </main>

    <!-- Quiz Modal -->
    <div id="quizModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full mx-4">
            <h2 class="text-2xl font-bold mb-4 text-gray-800">이해 확인 퀴즈 🎯</h2>
            <p id="quizQuestion" class="text-lg mb-6 text-gray-700 font-medium"></p>
            <div class="space-y-3" id="quizOptions">
                <!-- Buttons injected by JS -->
            </div>
            <p id="quizFeedback" class="mt-4 font-bold text-center h-6 text-lg"></p>
            <button onclick="closeQuiz()" class="mt-6 w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded transition-colors">
                닫기
            </button>
        </div>
    </div>

    <script>
        // --- State Variables ---
        let mode = 1; // 1: Obs moves, 2: Src moves, 3: Both
        const v = 340; // Speed of sound (m/s)
        const f = 1000; // Original frequency (Hz)
        let v_o = 0; // Observer speed
        let v_s = 0; // Source speed

        // Canvas specific
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        let xs = 0; // Source X position
        let xo = 0; // Observer X position
        const yPos = 0; // Will be set to center vertically
        
        let waves = []; // Array to hold sound waves {x, r}
        let lastWaveTime = 0;
        const waveInterval = 300; // ms between wave emissions
        const pxPerMeter = 0.5; // Scale for drawing
        const canvasSoundSpeed = 100; // px per second for wave expansion

        // --- Initialization ---
        function resizeCanvas() {
            width = canvas.clientWidth;
            height = canvas.clientHeight;
            canvas.width = width;
            canvas.height = height;
            
            // Set initial positions
            xs = width * 0.25;
            xo = width * 0.75;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        requestAnimationFrame(renderLoop);
        updateState();

        // --- Logic Functions ---
        function setMode(newMode) {
            mode = newMode;
            
            // Update Tab UI
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('font-bold', 'text-blue-600', 'border-b-2', 'border-blue-600');
                btn.classList.add('font-medium', 'text-gray-500');
            });
            const activeTab = document.getElementById(`tab${mode}`);
            activeTab.classList.remove('font-medium', 'text-gray-500');
            activeTab.classList.add('font-bold', 'text-blue-600', 'border-b-2', 'border-blue-600');

            // Reset Sliders
            document.getElementById('sliderVo').value = 0;
            document.getElementById('sliderVs').value = 0;
            
            const obsCtrl = document.getElementById('obsControl');
            const srcCtrl = document.getElementById('srcControl');

            if (mode === 1) {
                obsCtrl.classList.remove('opacity-50', 'pointer-events-none');
                srcCtrl.classList.add('opacity-50', 'pointer-events-none');
            } else if (mode === 2) {
                obsCtrl.classList.add('opacity-50', 'pointer-events-none');
                srcCtrl.classList.remove('opacity-50', 'pointer-events-none');
            } else {
                obsCtrl.classList.remove('opacity-50', 'pointer-events-none');
                srcCtrl.classList.remove('opacity-50', 'pointer-events-none');
            }

            // Reset simulation positions and waves
            xs = width * 0.25;
            xo = width * 0.75;
            waves = [];
            
            updateState();
        }

        function updateState() {
            v_o = parseInt(document.getElementById('sliderVo').value);
            v_s = parseInt(document.getElementById('sliderVs').value);

            // Force inactive sliders to 0 based on mode
            if (mode === 1) v_s = 0;
            if (mode === 2) v_o = 0;

            document.getElementById('voValue').textContent = `${v_o} m/s`;
            document.getElementById('vsValue').textContent = `${v_s} m/s`;

            updateMathAndText();
        }

        function updateMathAndText() {
            const fd = document.getElementById('formulaDisplay');
            const cd = document.getElementById('calculationDisplay');
            const et = document.getElementById('explanationText');

            let numText = `v`;
            let denText = `v`;
            let calcNum = v;
            let calcDen = v;
            
            let expLines = [];

            // 1. 관찰자 이동
            if (v_o > 0) {
                numText = `v + v<sub>O</sub>`;
                calcNum = v + v_o;
                expLines.push(`관찰자가 다가가므로 상대적인 소리의 속력(<span class="italic">v'</span>)이 <strong>빨라집니다.</strong> (${v} + ${v_o} = ${v+v_o}m/s)`);
            } else if (v_o < 0) {
                numText = `v - v<sub>O</sub>`;
                calcNum = v + v_o; // v_o is negative, so this acts as subtraction
                expLines.push(`관찰자가 멀어지므로 상대적인 소리의 속력(<span class="italic">v'</span>)이 <strong>느려집니다.</strong> (${v} - ${Math.abs(v_o)} = ${v+v_o}m/s)`);
            } else if (mode === 1 || mode === 3) {
                expLines.push(`관찰자가 정지해 있어 소리의 상대 속도는 변하지 않습니다.`);
            }

            // 2. 음원 이동
            if (v_s > 0) {
                denText = `v - v<sub>s</sub>`;
                calcDen = v - v_s;
                expLines.push(`음원이 다가오므로 관찰자 앞의 파장(<span class="italic">λ'</span>)이 <strong>짧게 압축됩니다.</strong>`);
            } else if (v_s < 0) {
                denText = `v + v<sub>s</sub>`;
                calcDen = v - v_s; // v_s is negative, so this acts as addition
                expLines.push(`음원이 멀어지므로 관찰자 앞의 파장(<span class="italic">λ'</span>)이 <strong>길게 늘어납니다.</strong>`);
            } else if (mode === 2 || mode === 3) {
                expLines.push(`음원이 정지해 있어 파장의 길이는 변하지 않습니다.`);
            }

            // Calculate final frequency
            const f_prime = (calcNum / calcDen) * f;

            // Generate Formula HTML
            fd.innerHTML = `
                <span class="italic font-serif">f'</span> = 
                <div class="math-fraction">
                    <span class="math-numerator italic font-serif">${numText}</span>
                    <span class="math-denominator italic font-serif">${denText}</span>
                </div>
                <span class="italic font-serif">f</span>
            `;

            // Generate Calculation HTML
            cd.innerHTML = `
                <span class="italic font-serif">f'</span> = 
                <div class="math-fraction text-lg">
                    <span class="math-numerator">${calcNum}</span>
                    <span class="math-denominator">${calcDen}</span>
                </div>
                &times; ${f} &approx; <span class="${f_prime > f ? 'text-red-600' : (f_prime < f ? 'text-blue-600' : 'text-gray-800')}">${f_prime.toFixed(1)} Hz</span>
            `;

            // Final explanation line
            if (f_prime > f) {
                expLines.push(`결과적으로 진동수가 커져 <strong>원래보다 높은 소리</strong>가 들립니다.`);
            } else if (f_prime < f) {
                expLines.push(`결과적으로 진동수가 작아져 <strong>원래보다 낮은 소리</strong>가 들립니다.`);
            } else {
                expLines.push(`결과적으로 진동수가 변하지 않아 <strong>원래와 같은 소리</strong>가 들립니다.`);
            }

            et.innerHTML = expLines.join('<br><br>');
        }

        // --- Canvas Rendering Loop ---
        let lastTime = performance.now();
        
        function renderLoop(currentTime) {
            let dt = (currentTime - lastTime) / 1000;
            if (dt < 0) dt = 0; // 프레임 초기화 시 음수 시간차가 발생하지 않도록 방지
            lastTime = currentTime;
            
            ctx.clearRect(0, 0, width, height);
            const centerY = height / 2;

            // Move objects
            // Convert real velocity (-85 to 85) to canvas velocity
            const canvasVs = v_s * pxPerMeter;
            const canvasVo = -v_o * pxPerMeter; // If v_o is positive (approaching), it moves left (negative x)

            xs += canvasVs * dt;
            xo += canvasVo * dt;

            // Boundary checks (Treadmill effect/Reset to prevent them running off screen)
            if (xs < 20 || xs > width - 20 || xo < 20 || xo > width - 20 || xs >= xo) {
                xs = width * 0.25;
                xo = width * 0.75;
                waves = []; // clear waves on wrap
                showResetNotification();
            }

            // Emit Waves
            if (currentTime - lastWaveTime > waveInterval) {
                waves.push({ x: xs, r: 0 });
                lastWaveTime = currentTime;
            }

            // Draw Ground
            ctx.fillStyle = '#e5e7eb'; // gray-200
            ctx.fillRect(0, centerY + 20, width, height - (centerY + 20));
            ctx.beginPath();
            ctx.moveTo(0, centerY + 20);
            ctx.lineTo(width, centerY + 20);
            ctx.strokeStyle = '#9ca3af';
            ctx.stroke();

            // Update and Draw Waves
            // In textbook: Light blue circles
            ctx.lineWidth = 2;
            for (let i = waves.length - 1; i >= 0; i--) {
                waves[i].r += canvasSoundSpeed * dt;
                
                if (waves[i].r > width) {
                    waves.splice(i, 1);
                    continue;
                }
                
                ctx.beginPath();
                // 반지름이 음수가 되어 에러가 발생하는 것을 방지
                const radius = Math.max(0.1, waves[i].r); 
                ctx.arc(waves[i].x, centerY, radius, 0, Math.PI * 2);
                // 연파랑 색상 (사진 반영)
                ctx.strokeStyle = `rgba(96, 165, 250, ${Math.max(0, 1 - radius/width)})`; 
                ctx.stroke();
            }

            // Draw Source (Ambulance)
            drawAmbulance(xs, centerY, v_s);
            
            // Draw Observer (Bicycle/Person)
            drawObserver(xo, centerY, v_o);

            requestAnimationFrame(renderLoop);
        }

        function drawAmbulance(x, y, speed) {
            // Body
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(x - 25, y - 20, 50, 30);
            ctx.strokeStyle = '#94a3b8';
            ctx.strokeRect(x - 25, y - 20, 50, 30);
            
            // Window (Blue)
            ctx.fillStyle = '#7dd3fc';
            ctx.fillRect(x - 15, y - 15, 15, 10);
            
            // Red Cross
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(x + 5, y - 10, 10, 3);
            ctx.fillRect(x + 8.5, y - 13.5, 3, 10);
            
            // Wheels
            ctx.fillStyle = '#334155';
            ctx.beginPath(); ctx.arc(x - 15, y + 10, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + 15, y + 10, 5, 0, Math.PI*2); ctx.fill();

            // Label 'S'
            ctx.fillStyle = 'black';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('S', x - 4, y - 25);

            // Green arrows (Wave propagation speed v)
            if (speed === 0 && v_o === 0) {
                 drawArrow(x, y, x+30, y-20, '#22c55e', 'v');
                 drawArrow(x, y, x-30, y-20, '#22c55e', '');
                 drawArrow(x, y, x, y-40, '#22c55e', '');
            } else {
                 drawArrow(x, y, x+30, y-20, '#22c55e', 'v');
                 drawArrow(x, y, x, y-40, '#22c55e', '');
            }

            // Velocity Arrow (Red)
            if (speed !== 0) {
                const dir = speed > 0 ? 1 : -1;
                drawArrow(x, y + 25, x + dir * 40, y + 25, '#ef4444', 'v_s');
            } else {
                ctx.fillStyle = 'black';
                ctx.font = '12px Arial';
                ctx.fillText('정지', x - 12, y + 30);
            }
        }

        function drawObserver(x, y, speed) {
            // Bicycle emoji or stick figure
            ctx.font = '30px Arial';
            ctx.fillText('🚴', x - 15, y + 10);
            
            // Label 'O'
            ctx.fillStyle = 'black';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('O', x - 4, y - 25);

            // Velocity Arrow (Red)
            if (speed !== 0) {
                // If speed > 0 (approaching), moves left. If < 0, moves right.
                const dir = speed > 0 ? -1 : 1; 
                drawArrow(x, y + 25, x + dir * 40, y + 25, '#ef4444', 'v_O');
            } else {
                ctx.fillStyle = 'black';
                ctx.font = '12px Arial';
                ctx.fillText('정지', x - 12, y + 30);
            }
        }

        function drawArrow(fromx, fromy, tox, toy, color, label) {
            const headlen = 8;
            const dx = tox - fromx;
            const dy = toy - fromy;
            const angle = Math.atan2(dy, dx);
            
            ctx.beginPath();
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();

            if (label) {
                ctx.fillStyle = color;
                ctx.font = 'italic bold 14px serif';
                // Handle subscript for 'O' or 's'
                if(label === 'v_s') {
                    ctx.fillText('v', tox + (dx>0?5:-15), toy + 5);
                    ctx.font = 'italic bold 10px serif';
                    ctx.fillText('s', tox + (dx>0?12:-8), toy + 8);
                } else if(label === 'v_O') {
                    ctx.fillText('v', tox + (dx>0?5:-15), toy + 5);
                    ctx.font = 'italic bold 10px serif';
                    ctx.fillText('O', tox + (dx>0?12:-8), toy + 8);
                } else {
                    ctx.fillText(label, tox + (dx>0?5:-15), toy + 5);
                }
            }
        }

        let notiTimeout;
        function showResetNotification() {
            const noti = document.getElementById('resetNoti');
            noti.classList.remove('opacity-0');
            clearTimeout(notiTimeout);
            notiTimeout = setTimeout(() => {
                noti.classList.add('opacity-0');
            }, 1500);
        }

        // --- Quiz Logic ---
        const questions = [
            {
                q: "구급차(음원)는 가만히 있고, 내가 자전거를 타고 구급차를 향해 빠르게 달려가고 있습니다. 이때 내가 듣는 사이렌 소리는 어떻게 될까요?",
                options: ["원래보다 높은 소리가 난다.", "원래보다 낮은 소리가 난다.", "원래와 똑같은 소리가 난다."],
                answer: 0,
                exp: "정답입니다! 관찰자가 음원에 다가가면, 상대적인 소리의 속력이 빨라져서 더 높은 진동수의 소리를 듣게 됩니다."
            },
            {
                q: "나는 정류장에 가만히 서 있는데, 사이렌을 울리는 구급차가 내 앞을 지나쳐서 멀어지고 있습니다. 이때 내가 듣는 사이렌 소리는 어떻게 될까요?",
                options: ["원래보다 높은 소리가 난다.", "원래보다 낮은 소리가 난다.", "원래와 똑같은 소리가 난다."],
                answer: 1,
                exp: "정답입니다! 음원이 멀어지면, 내게 도달하는 파장이 길게 늘어나서 더 낮은 진동수의 소리를 듣게 됩니다."
            },
            {
                q: "나와 구급차가 서로를 향해 마주 보며 달려오고 있습니다. 이때 들리는 소리는?",
                options: ["원래 소리보다 낮아진다.", "원래 소리보다 아주 높아진다.", "변화가 없다."],
                answer: 1,
                exp: "정답입니다! 분자(관찰자 접근)는 커지고 분모(음원 접근)는 작아지므로 진동수가 크게 증가하여 아주 높은 소리가 납니다."
            }
        ];

        function openQuiz() {
            const modal = document.getElementById('quizModal');
            const qObj = questions[Math.floor(Math.random() * questions.length)];
            
            document.getElementById('quizQuestion').innerText = qObj.q;
            document.getElementById('quizFeedback').innerText = "";
            document.getElementById('quizFeedback').className = "mt-4 font-bold text-center h-6 text-lg";
            
            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';
            
            qObj.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 border border-gray-300 rounded-lg hover:bg-blue-50 hover:border-blue-500 transition-colors";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx, qObj.answer, qObj.exp, optionsContainer);
                optionsContainer.appendChild(btn);
            });
            
            modal.classList.remove('hidden');
        }

        function checkAnswer(selected, correct, exp, container) {
            const feedback = document.getElementById('quizFeedback');
            const buttons = container.querySelectorAll('button');
            
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === correct) {
                    btn.classList.add('bg-green-100', 'border-green-500', 'font-bold');
                } else if (idx === selected && selected !== correct) {
                    btn.classList.add('bg-red-100', 'border-red-500', 'line-through');
                }
            });

            if (selected === correct) {
                feedback.innerText = "⭕ " + exp;
                feedback.classList.add('text-green-600');
            } else {
                feedback.innerText = "❌ 아쉽네요. 다시 한 번 시뮬레이션을 조작해보세요!";
                feedback.classList.add('text-red-600');
            }
        }

        function closeQuiz() {
            document.getElementById('quizModal').classList.add('hidden');
        }

    </script>
</body>
</html>
